name: linux

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: linux (x86_64)
    runs-on: ubuntu-latest
    # Ubuntu has no SDL3_mixer package yet, Debian testing has all the SDL3
    # libraries.
    container: debian:testing

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # The downloaded packages stay in the apt cache for actions/cache.
      - name: Keep apt downloads
        run: rm -f /etc/apt/apt.conf.d/docker-clean

      - name: Cache apt downloads
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: apt-debian-testing-${{ hashFiles('.github/workflows/linux.yml') }}-${{ github.run_id }}
          restore-keys: |
            apt-debian-testing-${{ hashFiles('.github/workflows/linux.yml') }}-
            apt-debian-testing-

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates python3 \
            libsdl3-dev libsdl3-image-dev libsdl3-ttf-dev libsdl3-mixer-dev

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version comes from the latest tag (git describe).
          fetch-depth: 0

      - name: Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Check style
        run: cmake --build build --target check_style

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The tracked files of the commit.
      - name: Pack sources
        run: |
          git archive --format=tar.gz --prefix="FreeSerf-$VERSION/" \
                      -o "build/FreeSerf-$VERSION-src.tar.gz" HEAD

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: FreeSerf-src
          path: build/FreeSerf-*-src.tar.gz

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" packages/* \
            --repo "${{ github.repository }}" --clobber
