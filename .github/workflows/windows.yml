name: windows

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    name: windows (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            triplet: x64-windows
          - arch: x86
            platform: Win32
            triplet: x86-windows

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version comes from the latest tag (git describe).
          fetch-depth: 0

      # vcpkg of the runner image builds the libraries of cmake/vcpkg.json;
      # its binary cache is kept between the runs.
      - name: Set up vcpkg
        run: |
          echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
          echo "VCPKG_COMMIT=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP\\vcpkg-cache,readwrite" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('cmake/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-

      # Visual Studio of the runner image; vcpkg installs the libraries here.
      - name: Configure
        run: |
          cmake -S . -B build -A ${{ matrix.platform }} \
                -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT\\scripts\\buildsystems\\vcpkg.cmake" \
                -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE\\cmake" \
                -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # NSIS of the runner image.
      - name: Pack installer
        run: |
          cd build
          cpack -C Release -G "NSIS;ZIP" -D CPACK_PACKAGE_FILE_NAME="FreeSerf-$VERSION-Windows-${{ matrix.arch }}"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: FreeSerf-Windows-${{ matrix.arch }}
          path: |
            build/FreeSerf-*.exe
            build/FreeSerf-*.zip

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" packages/* \
            --repo "${{ github.repository }}" --clobber
