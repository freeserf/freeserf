name: windows

on:
  pull_request:
  push:
  release:
    types: published

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        buildtype: [Debug, Release]
        architecture: [x86, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.architecture }}

      # vcpkg's binary cache in a directory kept with actions/cache. The
      # x-gha backend run-vcpkg sets up by default was removed from vcpkg,
      # so without this SDL3 and its dependencies are built on every run.
      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.architecture }}-${{ hashFiles('cmake/vcpkg.json', '.github/workflows/windows.yml') }}
          restore-keys: |
            vcpkg-${{ matrix.architecture }}-

      - name: Create vcpkg cache directory
        shell: bash
        run: |
          mkdir -p vcpkg_cache

      - name: Install dependencies
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_DEFAULT_TRIPLET: '${{ matrix.architecture }}-windows'
          VCPKG_INSTALLED_DIR: '${{ github.workspace }}/vcpkg/installed'
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg_cache,readwrite'
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
          runVcpkgInstall: true
          vcpkgJsonGlob: '**/cmake/vcpkg.json'

      - name: Configure FreeSerf
        run: |
          cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }}

      - name: Build FreeSerf
        shell: bash
        run: |
          cd build
          nmake

      - name: Run Tests
        shell: bash
        run: |
          cd build
          nmake test

      - name: Install NSIS
        run: |
          choco install nsis -y

      - name: Pack FreeSerf
        shell: bash
        run: |
          cd build
          nmake package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FreeSerf-${{ matrix.architecture }}-${{ matrix.buildtype }}
          path: ./build/FreeSerf-${{ matrix.architecture }}-${{ matrix.buildtype }}.exe
