name: macos

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The libraries from Homebrew, installed as bottles.
  BREW_PACKAGES: sdl3 sdl3_image sdl3_ttf sdl3_mixer
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    name: macos (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The version comes from the latest tag (git describe).
          fetch-depth: 0

      - name: Version
        run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Homebrew cache directory
        run: echo "BREW_CACHE=$(brew --cache)" >> "$GITHUB_ENV"

      # The downloaded bottles, kept between the runs.
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.BREW_CACHE }}/downloads
          key: brew-${{ matrix.runner }}-${{ env.BREW_PACKAGES }}-${{ github.run_id }}
          restore-keys: |
            brew-${{ matrix.runner }}-${{ env.BREW_PACKAGES }}-

      - name: Install dependencies
        run: brew install $BREW_PACKAGES

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The Homebrew libraries are copied into the bundle.
      - name: Pack disk image
        run: |
          cd build
          cpack -G DragNDrop -D CPACK_PACKAGE_FILE_NAME="FreeSerf-$VERSION-macOS-${{ matrix.arch }}"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: FreeSerf-macOS-${{ matrix.arch }}
          path: build/FreeSerf-*.dmg

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" packages/* \
            --repo "${{ github.repository }}" --clobber
