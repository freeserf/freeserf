name: macos

on:
  pull_request:
  push:
  release:
    types: published

jobs:
  build:
    # Attaches the packages to a published release.
    permissions:
      contents: write
    runs-on: macos-latest

    strategy:
      matrix:
        buildtype: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          # The version comes from the latest tag (git describe).
          fetch-depth: 0

      - name: Get macOS version
        id: macos
        run: |
          echo "major=$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      # MacPorts with the SDL3 ports takes about 10 minutes to install, so
      # /opt/local is cached. The key changes with the macOS version, the
      # runner architecture and this workflow (e.g. the list of ports).
      - name: Cache MacPorts
        id: cache-macports
        uses: actions/cache@v6
        with:
          path: ~/macports
          key: macports-${{ steps.macos.outputs.major }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/macos.yml') }}

      - name: Install dependencies
        if: steps.cache-macports.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MACOS_MAJOR=${{ steps.macos.outputs.major }}
          MACPORTS_PKG=$(gh api repos/macports/macports-base/releases/latest \
                         --jq ".assets[] | select(.name | test(\"^MacPorts-[0-9.]+-${MACOS_MAJOR}-[A-Za-z]+\\\\.pkg$\")) | .browser_download_url")
          wget -q "${MACPORTS_PKG}" -O MacPorts.pkg
          sudo installer -pkg ./MacPorts.pkg -target /
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          sudo port selfupdate -N
          sudo port install SDL3 +universal -N
          sudo port install SDL3_mixer +universal -N
          sudo port install SDL3_image +universal -N
          sudo port install SDL3_ttf +universal -N
          # Copy for the cache, without the ports tree, downloads and archives.
          mkdir -p ~/macports/local
          sudo rsync -a --exclude var/macports/sources \
                        --exclude var/macports/distfiles \
                        --exclude var/macports/build \
                        --exclude var/macports/software \
                        /opt/local/ ~/macports/local/
          sudo chown -R $USER:staff ~/macports

      - name: Restore dependencies
        if: steps.cache-macports.outputs.cache-hit == 'true'
        run: |
          sudo mkdir -p /opt/local
          sudo rsync -a ~/macports/local/ /opt/local/

      - name: Configure FreeSerf
        run: |
          cmake -B build -G "Unix Makefiles"

      - name: Check style
        run: |
          cd build
          make check_style

      - name: Build FreeSerf
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          cd build
          make

      - name: Run Tests
        run: |
          cd build
          make test

      - name: Pack FreeSerf
        run: |
          cd build
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FreeSerf-${{ matrix.buildtype }}
          path: ./build/FreeSerf.dmg

      - name: Attach to release
        if: github.event_name == 'release' && matrix.buildtype == 'Release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ./build/FreeSerf.dmg --clobber
