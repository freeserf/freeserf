name: macos

on:
  pull_request:
  push:
  release:
    types: published

jobs:
  build:
    runs-on: macos-latest

    strategy:
      matrix:
        buildtype: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MACOS_MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          MACPORTS_PKG=$(gh api repos/macports/macports-base/releases/latest \
                         --jq ".assets[] | select(.name | test(\"^MacPorts-[0-9.]+-${MACOS_MAJOR}-[A-Za-z]+\\\\.pkg$\")) | .browser_download_url")
          wget -q "${MACPORTS_PKG}" -O MacPorts.pkg
          sudo installer -pkg ./MacPorts.pkg -target /
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          sudo port selfupdate -N
          sudo port install libsdl2 +universal -N
          sudo port install libsdl2_mixer +universal -N
          sudo port install libsdl2_image +universal -N
          mkdir ~/macports
          sudo cp -R /opt/local ~/macports
          sudo chown -R $USER:staff ~/macports

      - name: Configure FreeSerf
        run: |
          cmake -B build -G "Unix Makefiles"

      - name: Check style
        run: |
          cd build
          make check_style

      - name: Build FreeSerf
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          cd build
          make

      - name: Run Tests
        run: |
          cd build
          make test

      - name: Pack FreeSerf
        run: |
          cd build
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FreeSerf-${{ matrix.buildtype }}
          path: ./build/FreeSerf.dmg
